<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALANWAR AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6F6;--sf:#fff;--tx:#141414;--mu:#5E5E5E;--ln:#E3E3E3;--nv:#111;--am:#b5121b;--rd:#8f0e15;--gn:#2E7D4F}
@media (prefers-color-scheme:dark){:root{--bg:#0e0e0e;--sf:#1a1a1a;--tx:#f0f0f0;--mu:#a5a5a5;--ln:#333;--nv:#000;--am:#d92432;--rd:#ef4b57;--gn:#4cb57a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6}
header{background:var(--nv);color:#fff;padding:10px 16px 0;position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top b{font-size:18px;font-weight:800}.top b i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--am);box-shadow:0 0 10px var(--am);margin-left:6px}
.top b{white-space:nowrap}.top>span{font-size:13px;display:flex;align-items:center;gap:6px;min-width:0}.top>span .btn{opacity:.9}@media (max-width:560px){.hbr{display:none}}#acc{background:rgba(255,255,255,.12);max-width:min(60vw,420px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:6px}
.tabs button{background:none;border:0;color:#fff;opacity:.7;font:inherit;padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--bg);color:var(--tx);opacity:1;font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px 14px 50px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mu)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:7px 9px;width:100%}
input[type=checkbox]{width:auto}
.btn{background:var(--nv);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer}
.btn.am{background:var(--am);color:#fff;font-weight:600}.btn.rd{background:var(--rd)}.btn.sm{padding:4px 10px;font-size:13px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.k div{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px}
.k b{display:block;font-size:20px}.k span{font-size:12px;color:var(--mu)}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:20px;border:1px solid var(--ln);color:var(--mu)}
.t1{color:var(--am);border-color:var(--am)}.t2{color:var(--rd);border-color:var(--rd)}.t0{color:var(--gn);border-color:var(--gn)}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.hint{color:var(--mu);font-size:13px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:600}
.msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--nv);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9;max-width:90vw}
.msg.show{display:block}.msg.bad{background:var(--rd)}
.login{max-width:380px;margin:8vh auto;border-top:4px solid var(--am)}.lg{text-align:center;margin-bottom:8px}.lg img{max-width:190px;max-height:110px;object-fit:contain;display:block;margin:0 auto 6px}.lgt{font-weight:800;font-size:20px;letter-spacing:1px}.top img{height:28px;vertical-align:middle;margin-left:8px;background:#fff;border-radius:4px;padding:2px}
.pay{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pay>*{flex:1;min-width:110px;width:auto}
.alert{border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px;border:1px solid var(--ln)}.alert.ok{border-color:var(--gn);color:var(--gn)}.alert.bad{border-color:var(--rd);color:var(--rd)}
.stp{display:flex;gap:4px;margin:6px 0}.stp span{flex:1;text-align:center;font-size:12px;padding:3px 2px;border-radius:6px;background:var(--bg);color:var(--mu);border:1px solid var(--ln)}.stp .dn{background:var(--gn);color:#fff;border-color:var(--gn)}.stp .cur{background:var(--am);color:#fff;border-color:var(--am);font-weight:600}
details.card>summary{cursor:pointer;list-style:none}details.card>summary::-webkit-details-marker{display:none}

.kv{width:100%;border-collapse:collapse;margin-bottom:6px}.kv th{width:30%;text-align:right;color:var(--mu);font-weight:600;white-space:normal;vertical-align:top}.kv td{white-space:normal}
.cfile h3{margin:14px 0 6px;font-size:15px;border-bottom:2px solid var(--am);padding-bottom:2px}.ph{display:flex;gap:12px;align-items:center}.ph>div{line-height:1.9}.ph b{font-size:16px}.ph img{height:54px}.pg{display:flex;gap:8px;flex-wrap:wrap}.pb{flex:1;min-width:220px;border:1px solid var(--ln);border-radius:8px;padding:8px}
.sig{display:flex;justify-content:space-around;margin-top:26px;text-align:center}
#pv{display:none}
.rpage{page-break-after:always}.rc{display:flex;border:1.5px solid #000;margin-bottom:6mm;height:84mm;overflow:hidden;font-size:14px;line-height:1.5;color:#000;background:#fff;font-weight:600}.rc .rmain{flex:1;min-width:0;padding:3mm 5mm 2mm;border-left:2px dashed #000;display:flex;flex-direction:column;justify-content:space-between}.rc .rstub{flex:none;width:26%;box-sizing:border-box;padding:3mm 3mm 2mm;display:flex;flex-direction:column;justify-content:space-between;font-size:12.5px}.rc .rt{text-align:center}.rc .rt b{display:inline-block;border:2px solid #000;border-radius:14px;padding:1px 26px;font-size:21px;box-shadow:2px 2px 0 #000}.rc .ln{display:flex;align-items:flex-end;gap:5px;white-space:nowrap}.rc .ln>i{font-style:normal}.rc .dt{flex:1;min-width:12mm;border-bottom:1.5px dotted #000;text-align:center;font-weight:700;white-space:normal;overflow:hidden;max-height:3em;line-height:1.35;padding:0 3px}.rc .amt{align-items:stretch}.rc .amt>i{align-self:center}.rc .sh{flex:1;white-space:normal;background:#bdbdbd;display:flex;align-items:center;justify-content:center;font-weight:700;padding:1px 6px;text-align:center;line-height:1.3;font-size:13px}.rc .lp{display:flex;border:1px solid #000;font-size:13px;text-align:center}.rc .lp div{display:flex;flex-direction:column;min-width:13mm}.rc .lp div+div{border-right:1px solid #000}.rc .lp span{border-bottom:1px solid #000;font-size:11px;padding:0 3px}.rc .lp b{padding:1px 3px}.rc .fx{font-weight:700}.rc .bx{border:1.5px solid #000;width:72%;margin:0 auto;text-align:center;font-size:12px}.rc .bx div{padding:1px 2px;min-height:6mm}.rc .bx div+div{border-top:1.5px solid #000}.rc .rstub .ln{white-space:normal;flex-direction:column;align-items:stretch;gap:0}.rc .rstub .dt{text-align:right;min-height:1.4em}
@media print{@page{size:A4;margin:12mm}body.printing>*:not(#pv){display:none!important}body.printing #pv{display:block!important;background:#fff;color:#000}body.printing{background:#fff}#pv .kv th,#pv .kv td{border:1px solid #999;padding:3px 6px;color:#000;font-size:12px}#pv .pb{border-color:#999}#pv a{color:#000;text-decoration:none}#pv .cfile h3{border-color:#000}}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:10px}.two>div>.pb:only-child{height:100%}.pb .kv th{width:34%}.md{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;overflow:auto;padding:12px}.md>.card{max-width:960px;margin:0 auto}
:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.pgx{border:1px solid var(--ln);border-radius:10px;padding:8px 10px;margin-top:8px}.pgx>b,.pgx .pgh b{display:flex;align-items:center;gap:6px}.pgh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);border-radius:999px;padding:5px 10px;font-size:13px;background:var(--bg);color:var(--mu);cursor:pointer;font:inherit;font-size:13px}
.pchip.on{background:var(--am);border-color:var(--am);color:#fff}.pchip[disabled]{cursor:default;opacity:.85}.pchip i{width:30px;height:16px;border-radius:9px;background:var(--ln);position:relative;flex:none}.pchip i:after{content:'';position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.15s}.pchip.on i{background:rgba(255,255,255,.45)}.pchip.on i:after{right:16px}
.ulist td{vertical-align:middle}.ulist .em{direction:ltr;text-align:right;font-size:12px;color:var(--mu)}
</style>

<script>
var $=function(s){return document.querySelector(s)};
var APP=$('#app'),S={me:null,zones:[],branches:[],products:[]},sb=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function n(x){return Math.round(+x||0).toLocaleString('en-US')}
function msg(t,bad){var m=$('#msg');m.textContent=t;m.className='msg show'+(bad?' bad':'');clearTimeout(msg.t);msg.t=setTimeout(function(){m.className='msg'},5000)}
function em(e){return (e&&e.message)||'حدث خطأ'}
function opts(a,v,l,sel,blank){return (blank?'<option value="">'+blank+'</option>':'')+a.map(function(x){return '<option value="'+esc(x[v])+'"'+(x[v]==sel?' selected':'')+'>'+esc(typeof l=='function'?l(x):x[l])+'</option>'}).join('')}
var RL={sales:'موظف مبيعات',collector:'موظف تحصيل',branch_manager:'مدير الفرع',credit_manager:'مسؤول ائتمان',field_agent:'موظف استعلام',system_admin:'المدير العام',lawyer:'محامي تفاوض',collection_rep:'مندوب تحصيل'};
var ST={legal:'شؤون قانونية',draft:'مسودة',pending_credit:'بانتظار الائتمان',approved:'معتمد ائتمانيًا',rejected:'مرفوض',active:'ساري',closed:'مغلق'};
var CT={regular:['منتظم','t0'],due:['مستحق','t1'],late:['متأخر +30','t2'],defaulted:['متعثر +60','t2'],bad:['سيئ +90','t2']};
var today=new Date().toISOString().slice(0,10);
var HS={owned:'تمليك',old_rent:'إيجار قديم',new_rent:'إيجار جديد'};
/* ---------- الصلاحيات ---------- */
var PI={eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',plus:'<path d="M12 5v14M5 12h14"/>',upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',send:'<path d="M4 12l16-8-6 16-3-7z"/>',check:'<path d="M5 12l5 5L20 7"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',note:'<path d="M5 4h14v12l-4 4H5z"/><path d="M9 9h6M9 13h4"/>',print:'<path d="M7 9V4h10v5M7 17H5v-6h14v6h-2M8 14h8v6H8z"/>',cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>',scale:'<path d="M12 4v16M6 20h12M5 8h14M7 8l-3 6h6zM17 8l-3 6h6z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>',pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0114 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',task:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l3 3 5-6"/>',bot:'<rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 4v4M9 13h.01M15 13h.01"/>',mega:'<path d="M3 11v2l13 5V6zM16 9a3 3 0 010 6M6 13l1 6h3l-1-5"/>',book:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 19V5"/>',link:'<path d="M10 14a4 4 0 006 0l3-3a4 4 0 00-6-6l-1 1M14 10a4 4 0 00-6 0l-3 3a4 4 0 006 6l1-1"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>'};
function pico(k){return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(PI[k]||PI.check)+'</svg>'}
var PG=[
 {t:'عام',ic:'globe',p:[['all_branches','يرى ويعمل على كل الفروع (بدونها يشتغل على فرعه بس)','globe'],['dash.view','لوحة التحكم','chart']]},
 {t:'العملاء',ic:'user',p:[['cust.view','عرض العملاء','eye'],['cust.edit','إضافة وتعديل العملاء','edit'],['cust.import','استيراد العملاء من شيت','upload']]},
 {t:'العقود',ic:'note',p:[['con.view','عرض العقود','eye'],['con.create','إنشاء وتفعيل عقد جديد','plus'],['con.manual','عقد قديم بقسط يدوي أو منتهي، وتعديل بيانات العقد','edit'],['con.send_credit','إرسال العقد للائتمان','send'],['con.credit','اعتماد أو رفض العقد ائتمانيًا','check'],['con.final','الاعتماد النهائي للعقد','shield'],['con.notes','تعديل ملاحظات البيعة','note'],['con.receipts','إيصالات الأمانة وعناوين البطاقة','print'],['con.import','استيراد وتصدير العقود','upload']]},
 {t:'التحصيل',ic:'cash',p:[['coll.view','عرض التحصيل والمتأخرين','eye'],['coll.pay','تسجيل تحصيل','cash'],['coll.cancel','إلغاء تحصيل','undo'],['coll.refer','تحويل العميل للشؤون القانونية','scale']]},
 {t:'الاستعلامات',ic:'pin',p:[['inv.create','رفع طلب الاستعلام ومستنداته وإرساله للزيارة','plus'],['inv.assign','إسناد الزيارة الميدانية لمسؤول','user'],['inv.visit','تنفيذ الاستعلام الميداني','pin'],['inv.credit','قرار الائتمان: موافقة أو رفض أو إرجاع','check'],['inv.cancel','إلغاء طلب الاستعلام','x'],['inv.view','عرض كل طلبات الاستعلام (مش طلباته بس)','eye']]},
 {t:'الشؤون القانونية',ic:'scale',p:[['legal.view','عرض كل القضايا (مش المسندة ليه بس)','eye'],['legal.work','العمل على القضايا: ملاحظات ومواعيد اتفاق','note'],['legal.status','تغيير حالة القضية وإنهاؤها','check'],['legal.reassign','نقل القضية لمسؤول آخر','user']]},
 {t:'المبيعات',ic:'chart',p:[['leads.view','عرض العملاء المحتملين','eye'],['leads.edit','إضافة وتحديث العملاء المحتملين','edit'],['leads.assign','توزيع العملاء المحتملين على الموظفين','user']]},
 {t:'المستهدفات والمهام',ic:'target',p:[['tgt.view','عرض المستهدفات','eye'],['tgt.edit','تحديد المستهدفات','target'],['task.view','المهام','task'],['task.assign','إسناد مهام لموظفين آخرين ومتابعتها','user']]},
 {t:'أقسام أخرى',ic:'book',p:[['fin.view','المالية والأداء','chart'],['ai.view','المساعد الذكي','bot'],['camp.manage','التسويق','mega'],['kb.manage','مركز المعرفة','book'],['integ.manage','الربط','link']]}];
var PALL=[].concat.apply([],PG.map(function(g){return g.p.map(function(x){return x[0]})}));
function can(k){return S.me&&S.me.role=='system_admin'||(S.perms||[]).indexOf(k)>=0}
function canAny(a){return a.some(can)}
function effPerms(p){if(!p)return [];if(p.role=='system_admin')return PALL.slice();return p.perms||(S.pdef&&S.pdef[p.role])||[]}
function pcan(p,k){return effPerms(p).indexOf(k)>=0}
function pickBr(){return can('all_branches')||!S.me.branch_id}
function dname(p){var x=p&&p.full_name;return x&&!/@/.test(x)?x:'(بدون اسم)'}

/* ---------- boot / login ---------- */
async function boot(){
 if(!window.CFG||!CFG.url||!CFG.key){APP.innerHTML='<div class="card login"><h2>الإعداد ناقص</h2><p class="hint">افتح ملف config.js وضع رابط مشروع Supabase والمفتاح العام (anon).</p></div>';return}
 sb=sb||supabase.createClient(CFG.url,CFG.key);
 var s=await sb.auth.getSession();
 if(!s.data.session)return loginView();
 var p=await sb.from('profiles').select('*').eq('id',s.data.session.user.id).single();
 if(p.error||!p.data)return loginView('تعذر قراءة حسابك');
 S.me=p.data;
 if(!S.me.active){APP.innerHTML='<div class="card login"><h2>حسابك غير مفعّل</h2><p class="hint">اطلب من مدير النظام تفعيل حسابك وتحديد فرعك ودورك.</p><button class="btn" id="lo">خروج</button></div>';$('#lo').onclick=out;return}
 var r=await Promise.all([sb.from('zones').select('*').order('name'),sb.from('branches').select('*').order('name'),sb.from('products').select('*').order('name')]);
 S.zones=r[0].data||[];S.branches=r[1].data||[];S.products=r[2].data||[];
 await loadMe(p.data);
 shell();go(S.nav[0]);live()
}
async function loadMe(me){
 var r=await Promise.all([sb.rpc('my_perms'),sb.rpc('perm_defaults'),sb.from('profiles').select('id,full_name,role,branch_id,active,perms')]);
 S.me=me;S.me.full_name=dname(me);S.perms=r[0].data||[];S.pdef=r[1].data||{};
 S.profiles=(r[2].data||[]).map(function(x){x.full_name=dname(x);return x});
 S.sig=[S.me.role,S.me.branch_id,S.me.full_name,S.me.active,S.perms.slice().sort().join(',')].join('|')
}
async function refreshMe(){
 if(!S.me||!sb)return;var p=await sb.from('profiles').select('*').eq('id',S.me.id).single();if(p.error||!p.data)return;
 if(!p.data.active)return boot();
 var old=S.sig;await loadMe(p.data);
 if(old!==S.sig){var cur=S.cur;shell();go(S.nav.indexOf(cur)>=0?cur:S.nav[0]);msg('تم تحديث صلاحياتك')}
}
function live(){
 try{if(S.ch)sb.removeChannel(S.ch);S.ch=sb.channel('me-'+S.me.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles',filter:'id=eq.'+S.me.id},function(){refreshMe()}).subscribe()}catch(e){}
 clearInterval(S.pt);S.pt=setInterval(refreshMe,60000);
 if(!live.b){live.b=1;document.addEventListener('visibilitychange',function(){if(!document.hidden)refreshMe()})}
}

var CU_CATS={all:'الكل',active:'نشط (عقد ساري)',late:'متأخر عن السداد',legal:'شؤون قانونية',closed:'منتهي (سدّد بالكامل)',inquiry:'استعلام موافق عليه (لم يستلم)',pending:'عقد قيد الإنشاء',none:'بدون عقد'};
var CU_HEAD=['كود العميل','الاسم','الهاتف','الرقم القومي','العنوان','المنطقة','نوع السكن','الدخل الشهري','الفرع','موافقة تسويق'];
function cuDig(s){return String(s==null?'':s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})}
function cuNorm(s){return String(s==null?'':s).replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim()}
function cuWords(s){return String(s||'').trim().split(/\s+/).filter(Boolean).length}
function cuQ(v){v=v==null?'':String(v);return /[",\n\t]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function cuParse(text){
 text=String(text||'').replace(/^﻿/,'');
 var lines=text.split(/\r?\n/),first=lines.filter(function(l){return l.trim()&&l.trim().charAt(0)!='#'})[0]||'';
 var d=first.indexOf('\t')>=0?'\t':first.indexOf(';')>=0&&first.indexOf(',')<0?';':',';
 var rows=[],row=[],cur='',q=false,i,c;
 for(i=0;i<text.length;i++){c=text.charAt(i);
  if(q){if(c=='"'){if(text.charAt(i+1)=='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c=='"')q=true;
  else if(c==d){row.push(cur);cur=''}
  else if(c=='\n'||c=='\r'){if(c=='\r'&&text.charAt(i+1)=='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
  else cur+=c}
 if(cur!==''||row.length){row.push(cur);rows.push(row)}
 return rows.filter(function(r){var a=String(r[0]||'').trim();return r.some(function(x){return String(x).trim()})&&a.charAt(0)!='#'&&a.indexOf('مثال')!==0})
}

 if(o.national_id&&!/^[0-9]{1,14}$/.test(o.national_id))e.push('الرقم القومي أكثر من 14 رقمًا أو به حروف');
 if(o.customer_code&&o.customer_code.length>40)e.push('الكود طويل');
 return e}

  if(t.id=='cex'){var d=chk(await sb.from('v_campaign_eligible').select('full_name,phone').limit(1000));if(!d.length)return msg('لا يوجد مستلمون مؤهلون',1);dl('campaign-recipients.csv','الاسم,الهاتف\n'+d.map(function(x){return '"'+String(x.full_name||'').replace(/"/g,'""')+'","'+String(x.phone||'').replace(/"/g,'""')+'"'}).join('\n'))}
  if(t.id=='cmb'){var nm=$('#cm1').value.trim();if(!nm)return msg('اكتب اسم الحملة',1);
   var x=await sb.from('campaigns').insert({name:nm,goal:$('#cm4').value.trim()||null,channel:$('#cm2').value,offer:$('#cm3').value.trim()||null,message:$('#cm5').value.trim()});
   if(x.error)return msg(em(x.error),1);msg('تم حفظ الحملة');vCamp()}}
}

/* ---------- الربط والتكاملات (خانات جاهزة بدون مفاتيح سرية) ---------- */
var IFD={whatsapp:[['phone_number_id','Phone Number ID'],['business_account_id','Business Account ID'],['sender_name','اسم المرسل']],sms:[['provider_name','اسم المزود'],['sender_id','Sender ID']],openai:[['model','النموذج (Model)'],['legal_approval_for_customer_data','تمت الموافقة القانونية على إرسال بيانات العملاء','bool']],vodafone_cash:[['merchant_number','رقم الاستلام'],['notes','ملاحظات']],maps:[['provider','المزود'],['default_lat','خط العرض الافتراضي'],['default_lng','خط الطول الافتراضي']],ai_assistant:[['autonomy_level','مستوى الاستقلالية','aut']]};
async function vInt(){
 var v=$('#v'),I=chk(await sb.from('integrations').select('*').order('label'));
 v.innerHTML='<div class="card"><h2>الربط والتكاملات</h2><p class="hint">هنا بيانات الربط غير السرية فقط. مفاتيح API السرية (OpenAI، واتساب، SMS) لا تُكتب في الموقع أبدًا، وتُضاف لاحقًا كأسرار (Secrets) في Supabase Edge Functions عند تفعيل الربط الفعلي.</p></div>'+I.map(function(i){
  var fs=IFD[i.provider]||[];
  return '<div class="card"><div class="row"><h2>'+esc(i.label)+'</h2><span>'+tg(i.enabled?'مفعّل':'غير مفعّل',i.enabled?'t0':'')+'</span></div><div class="f">'+fs.map(function(f){var id='if_'+i.provider+'_'+f[0],val=i.config[f[0]];
   if(f[2]=='bool')return '<div><label><input type="checkbox" id="'+id+'"'+(val?' checked':'')+'> '+f[1]+'</label></div>';
   if(f[2]=='aut')return '<div><label for="'+id+'">'+f[1]+'</label><select id="'+id+'">'+AUT.map(function(a,k){return '<option value="'+k+'"'+(k==(+val||0)?' selected':'')+'>'+k+' – '+a+'</option>'}).join('')+'</select></div>';
   return '<div><label for="'+id+'">'+f[1]+'</label><input id="'+id+'" value="'+esc(val)+'"></div>'}).join('')+'<div><label><input type="checkbox" id="en_'+i.provider+'"'+(i.enabled?' checked':'')+'> تفعيل</label></div></div><button class="btn sm am" data-isv="'+i.provider+'" style="margin-top:10px">حفظ</button></div>'}).join('');
 v.onclick=async function(e){var p=e.target.getAttribute('data-isv');if(!p)return;
  var it=I.filter(function(x){return x.provider==p})[0],cfg=Object.assign({},it.config);
  (IFD[p]||[]).forEach(function(f){var el=$('#if_'+p+'_'+f[0]);cfg[f[0]]=f[2]=='bool'?el.checked:f[2]=='aut'?+el.value:el.value.trim()});
  var en=$('#en_'+p).checked;
  if(p=='openai'&&en&&!cfg.legal_approval_for_customer_data)return msg('لا يمكن تفعيل OpenAI قبل تأكيد الموافقة القانونية على إرسال بيانات العملاء',1);
  upd('integrations',it.id,{config:cfg,enabled:en,updated_at:new Date().toISOString()},vInt)}
}

boot();
</script>
