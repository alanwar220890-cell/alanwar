<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALANWAR AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6F6;--sf:#fff;--tx:#141414;--mu:#5E5E5E;--ln:#E3E3E3;--nv:#111;--am:#b5121b;--rd:#8f0e15;--gn:#2E7D4F}
@media (prefers-color-scheme:dark){:root{--bg:#0e0e0e;--sf:#1a1a1a;--tx:#f0f0f0;--mu:#a5a5a5;--ln:#333;--nv:#000;--am:#d92432;--rd:#ef4b57;--gn:#4cb57a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6}
header{background:var(--nv);color:#fff;padding:10px 16px 0;position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top b{font-size:18px;font-weight:800}.top b i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--am);box-shadow:0 0 10px var(--am);margin-left:6px}
.top span{font-size:13px;opacity:.8}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:6px}
.tabs button{background:none;border:0;color:#fff;opacity:.7;font:inherit;padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--bg);color:var(--tx);opacity:1;font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px 14px 50px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mu)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:7px 9px;width:100%}
input[type=checkbox]{width:auto}
.btn{background:var(--nv);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer}
.btn.am{background:var(--am);color:#fff;font-weight:600}.btn.rd{background:var(--rd)}.btn.sm{padding:4px 10px;font-size:13px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.k div{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px}
.k b{display:block;font-size:20px}.k span{font-size:12px;color:var(--mu)}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:20px;border:1px solid var(--ln);color:var(--mu)}
.t1{color:var(--am);border-color:var(--am)}.t2{color:var(--rd);border-color:var(--rd)}.t0{color:var(--gn);border-color:var(--gn)}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.hint{color:var(--mu);font-size:13px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:600}
.msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--nv);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9;max-width:90vw}
.msg.show{display:block}.msg.bad{background:var(--rd)}
.login{max-width:380px;margin:8vh auto;border-top:4px solid var(--am)}.lg{text-align:center;margin-bottom:8px}.lg img{max-width:190px;max-height:110px;object-fit:contain;display:block;margin:0 auto 6px}.lgt{font-weight:800;font-size:20px;letter-spacing:1px}.top img{height:28px;vertical-align:middle;margin-left:8px;background:#fff;border-radius:4px;padding:2px}
.pay{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pay>*{flex:1;min-width:110px;width:auto}
.alert{border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px;border:1px solid var(--ln)}.alert.ok{border-color:var(--gn);color:var(--gn)}.alert.bad{border-color:var(--rd);color:var(--rd)}
.stp{display:flex;gap:4px;margin:6px 0}.stp span{flex:1;text-align:center;font-size:12px;padding:3px 2px;border-radius:6px;background:var(--bg);color:var(--mu);border:1px solid var(--ln)}.stp .dn{background:var(--gn);color:#fff;border-color:var(--gn)}.stp .cur{background:var(--am);color:#fff;border-color:var(--am);font-weight:600}
details.card>summary{cursor:pointer;list-style:none}details.card>summary::-webkit-details-marker{display:none}
:focus-visible{outline:2px solid var(--am);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<div class="msg" id="msg" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
var $=function(s){return document.querySelector(s)};
var APP=$('#app'),S={me:null,zones:[],branches:[],products:[]},sb=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function n(x){return Math.round(+x||0).toLocaleString('en-US')}
function msg(t,bad){var m=$('#msg');m.textContent=t;m.className='msg show'+(bad?' bad':'');clearTimeout(msg.t);msg.t=setTimeout(function(){m.className='msg'},5000)}
function em(e){return (e&&e.message)||'حدث خطأ'}
function opts(a,v,l,sel,blank){return (blank?'<option value="">'+blank+'</option>':'')+a.map(function(x){return '<option value="'+esc(x[v])+'"'+(x[v]==sel?' selected':'')+'>'+esc(typeof l=='function'?l(x):x[l])+'</option>'}).join('')}
var RL={sales:'موظف مبيعات',collector:'موظف تحصيل',branch_manager:'مدير الفرع',credit_manager:'مسؤول ائتمان',field_agent:'موظف استعلام',system_admin:'المدير العام',lawyer:'محامي تفاوض',collection_rep:'مندوب تحصيل'};
var ST={legal:'شؤون قانونية',draft:'مسودة',pending_credit:'بانتظار الائتمان',approved:'معتمد ائتمانيًا',rejected:'مرفوض',active:'ساري',closed:'مغلق'};
var CT={regular:['منتظم','t0'],due:['مستحق','t1'],late:['متأخر +30','t2'],defaulted:['متعثر +60','t2'],bad:['سيئ +90','t2']};
var today=new Date().toISOString().slice(0,10);

/* ---------- boot / login ---------- */
async function boot(){
 if(!window.CFG||!CFG.url||!CFG.key){APP.innerHTML='<div class="card login"><h2>الإعداد ناقص</h2><p class="hint">افتح ملف config.js وضع رابط مشروع Supabase والمفتاح العام (anon).</p></div>';return}
 sb=sb||supabase.createClient(CFG.url,CFG.key);
 var s=await sb.auth.getSession();
 if(!s.data.session)return loginView();
 var p=await sb.from('profiles').select('*').eq('id',s.data.session.user.id).single();
 if(p.error||!p.data)return loginView('تعذر قراءة حسابك');
 S.me=p.data;
 if(!S.me.active){APP.innerHTML='<div class="card login"><h2>حسابك غير مفعّل</h2><p class="hint">اطلب من مدير النظام تفعيل حسابك وتحديد فرعك ودورك.</p><button class="btn" id="lo">خروج</button></div>';$('#lo').onclick=out;return}
 var r=await Promise.all([sb.from('zones').select('*').order('name'),sb.from('branches').select('*').order('name'),sb.from('products').select('*').order('name')]);
 S.zones=r[0].data||[];S.branches=r[1].data||[];S.products=r[2].data||[];
 S.profiles=(await sb.from('profiles').select('id,full_name,role,branch_id,active')).data||[];
 shell();go(S.nav[0])
}
function loginView(m){
 APP.innerHTML='<div class="card login"><div class="lg"><img src="logo.png" alt="شعار الأنوار" onerror="this.style.display=\'none\'"><div class="lgt">ALANWAR AI</div><div class="hint">نظام الأنوار لإدارة البيع بالتقسيط</div></div><h2 style="text-align:center">تسجيل الدخول</h2>'+(m?'<p class="hint">'+esc(m)+'</p>':'')+'<label for="em">البريد الإلكتروني</label><input id="em" type="email" autocomplete="username"><label for="pw" style="margin-top:8px">كلمة المرور</label><input id="pw" type="password" autocomplete="current-password"><button class="btn am" id="li" style="margin-top:12px;width:100%">دخول</button></div>';
 $('#li').onclick=async function(){var r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(r.error){var m0=String(r.error.message||'');return msg(/fetch|network|failed/i.test(m0)?'تعذر الاتصال بالخادم (الصفحة محجوبة عن Supabase). افتح الموقع من ملف على جهازك أو من رابط GitHub Pages.':'بيانات الدخول غير صحيحة',1)};boot()};
 $('#pw').onkeydown=function(e){if(e.key=='Enter')$('#li').click()}
}
async function out(){await sb.auth.signOut();S.me=null;boot()}
function shell(){
 var NV={dash:'لوحة التحكم',cust:'العملاء',con:'العقود',coll:'التحصيل',leads:'المبيعات',inv:'الاستعلامات',legal:'الشؤون القانونية والقضايا',tgt:'المستهدفات',task:'المهام',fin:'المالية والأداء',camp:'التسويق',ai:'المساعد الذكي',kb:'مركز المعرفة',integ:'الربط',adm:'الإدارة'};
 var AC={system_admin:Object.keys(NV),credit_manager:['dash','cust','con','inv','legal','task'],branch_manager:['dash','cust','con','coll','legal','leads','inv','tgt','task','fin','ai'],sales:['dash','cust','con','leads','inv','tgt','task'],collector:['dash','cust','coll','legal','task'],field_agent:['inv','task'],lawyer:['legal'],collection_rep:['coll','legal']};
 S.nav=AC[S.me.role]||['dash'];
 var nav=S.nav.map(function(k){return [k,NV[k]]});
 var br=S.branches.filter(function(b){return b.id==S.me.branch_id})[0];
 APP.innerHTML='<header><div class="top"><b><img src="logo.png" alt="" onerror="this.style.display=\'none\'"><i></i>ALANWAR AI</b><span>'+esc(S.me.full_name||'')+' · '+RL[S.me.role]+(br?' · '+esc(br.name):'')+' <button class="btn sm" id="lo">خروج</button></span></div><div class="tabs">'+nav.map(function(t){return '<button data-v="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div></header><main id="v"></main>';
 $('#lo').onclick=out;
 document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){go(b.dataset.v)}})
}
function go(v){
 document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.v==v)});
 $('#v').onclick=null;$('#v').onchange=null;$('#v').innerHTML='<p class="hint">جارٍ التحميل…</p>';
 ({dash:vDash,cust:vCust,con:vCon,coll:vColl,adm:vAdm,leads:vLeads,inv:vInv,legal:vLegal,tgt:vTgt,task:vTasks,fin:vFin,camp:vCamp,ai:vAI,kb:vKB,integ:vInt})[v]().catch(function(e){$('#v').innerHTML='<div class="card">'+esc(em(e))+'</div>'})
}
function bn(id){var b=S.branches.filter(function(x){return x.id==id})[0];return b?b.name:''}

/* ---------- dashboard ---------- */
async function vDash(){await vDash0();await dashExtra()}
async function vDash0(){
 var r=await Promise.all([sb.from('v_delinquency').select('*'),sb.from('contracts').select('id,status,branch_id'),sb.from('payments').select('amount,branch_id').gte('paid_at',today)]);
 if(r[0].error)throw r[0].error;
 var d=r[0].data||[],c=r[1].data||[],p=r[2].data||[],cat={regular:0,due:0,late:0,defaulted:0,bad:0},ov=0,col=0,br={};
 d.forEach(function(x){cat[x.category]++;ov+=+x.overdue_amount;(br[x.branch_id]=br[x.branch_id]||{a:0,o:0,t:0}).o+=+x.overdue_amount});
 c.forEach(function(x){if(x.status=='active')(br[x.branch_id]=br[x.branch_id]||{a:0,o:0,t:0}).a++});
 p.forEach(function(x){col+=+x.amount;(br[x.branch_id]=br[x.branch_id]||{a:0,o:0,t:0}).t+=+x.amount});
 var act=c.filter(function(x){return x.status=='active'}).length,pc=c.filter(function(x){return x.status=='pending_credit'}).length;
 $('#v').innerHTML='<div class="k"><div><b>'+act+'</b><span>عقود سارية</span></div><div><b>'+pc+'</b><span>بانتظار الائتمان</span></div><div><b>'+n(ov)+'</b><span>مبالغ متأخرة (ج.م)</span></div><div><b>'+n(col)+'</b><span>تحصيل اليوم (ج.م)</span></div><div><b>'+cat.late+'</b><span>متأخر +30</span></div><div><b>'+cat.defaulted+'</b><span>متعثر +60</span></div><div><b>'+cat.bad+'</b><span>سيئ +90</span></div></div><div class="card"><h2>أداء الفروع</h2><div class="wrap"><table><tr><th>الفرع</th><th>عقود سارية</th><th>متأخرات (ج.م)</th><th>تحصيل اليوم</th></tr>'+Object.keys(br).map(function(k){return '<tr><td>'+esc(bn(k))+'</td><td>'+br[k].a+'</td><td>'+n(br[k].o)+'</td><td>'+n(br[k].t)+'</td></tr>'}).join('')+'</table></div></div>'
}

/* ---------- customers ---------- */
async function vCust(){
 var r=await sb.from('customers').select('*,zones(name),branches(name)').order('created_at',{ascending:false}).limit(500);
 if(r.error)throw r.error;
 var canNew=['system_admin','branch_manager','sales'].indexOf(S.me.role)>=0,v=$('#v');
 var form=canNew?'<div class="card"><h2>عميل جديد</h2><div class="f"><div><label for="cn">الاسم</label><input id="cn"></div><div><label for="cp">الهاتف</label><input id="cp" inputmode="tel"></div><div><label for="ci">الرقم القومي</label><input id="ci" inputmode="numeric"></div><div><label for="ca">العنوان</label><input id="ca"></div><div><label for="cz">المنطقة (من القائمة المعتمدة)</label><select id="cz">'+opts(S.zones,'id',function(z){return z.name+' – '+z.governorate},'','اختر')+'</select></div><div><label for="ch">نوع السكن</label><select id="ch"><option value="">اختر</option><option value="old_rent">إيجار قديم</option><option value="owned">تمليك</option></select></div><div><label for="cm">الدخل الشهري</label><input id="cm" type="number" min="0"></div>'+(S.me.role=='system_admin'?'<div><label for="cb">الفرع</label><select id="cb">'+opts(S.branches,'id','name','','اختر')+'</select></div>':'')+'<div><label><input type="checkbox" id="cc"> موافقة على التواصل التسويقي</label></div></div><button class="btn am" id="cs" style="margin-top:10px">حفظ العميل</button></div>':'';
 v.innerHTML=form+'<div class="card"><div class="row"><h2>العملاء ('+r.data.length+')</h2><input id="cq" placeholder="بحث بالاسم أو الهاتف" style="max-width:220px"></div><div class="wrap"><table id="ct"></table></div></div>';
 function draw(){var q=$('#cq').value.trim();$('#ct').innerHTML='<tr><th>الاسم</th><th>الهاتف</th><th>المنطقة</th><th>الفرع</th><th>الدخل</th></tr>'+r.data.filter(function(c){return !q||(c.full_name+' '+(c.phone||'')).indexOf(q)>=0}).map(function(c){return '<tr><td>'+esc(c.full_name)+'</td><td>'+esc(c.phone)+'</td><td>'+esc(c.zones&&c.zones.name)+'</td><td>'+esc(c.branches&&c.branches.name)+'</td><td>'+n(c.monthly_income)+'</td></tr>'}).join('')}
 draw();$('#cq').oninput=draw;
 if(canNew)$('#cs').onclick=async function(){
  var nm=$('#cn').value.trim();if(!nm)return msg('اكتب اسم العميل',1);
  var bid=S.me.role=='system_admin'?$('#cb').value:S.me.branch_id;if(!bid)return msg('حدد الفرع',1);
  var x=await sb.from('customers').insert({branch_id:bid,full_name:nm,phone:$('#cp').value.trim()||null,national_id:$('#ci').value.trim()||null,address:$('#ca').value.trim()||null,zone_id:$('#cz').value||null,housing:$('#ch').value||null,monthly_income:$('#cm').value?+$('#cm').value:null,marketing_consent:$('#cc').checked,consent_at:$('#cc').checked?new Date().toISOString():null});
  if(x.error)return msg(em(x.error),1);msg('تم حفظ العميل');vCust()}
}

/* ---------- contracts ---------- */
function calcC(p,d,m,r,me){var f=p-d,t,i;if(f<=0||m<1)return null;if(me=='flat'){t=f*(1+r/100*m/12);i=t/m}else{var q=r/1200;i=q>0?f*q/(1-Math.pow(1+q,-m)):f/m;t=i*m}return{inst:i,tot:t}}
async function vCon(){
 var r=await Promise.all([sb.from('contracts').select('*,customers(full_name),products(name)').order('created_at',{ascending:false}).limit(300),sb.from('customers').select('id,full_name,branch_id').order('full_name').limit(1500)]);
 if(r[0].error)throw r[0].error;
 var role=S.me.role,canNew=['system_admin','branch_manager','sales'].indexOf(role)>=0,v=$('#v'),cu=r[1].data||[];
 var form=canNew?'<div class="card"><h2>عقد جديد (مسودة)</h2><div class="f"><div><label for="kc">العميل</label><select id="kc">'+opts(cu,'id','full_name','','اختر')+'</select></div><div><label for="kp">المنتج</label><select id="kp">'+opts(S.products,'id',function(p){return p.name+' ('+p.annual_rate+'%)'},'','اختر')+'</select></div><div><label for="kr">السعر</label><input id="kr" type="number" min="0"></div><div><label for="kd">المقدم</label><input id="kd" type="number" min="0" value="0"></div><div><label for="km">المدة (أشهر)</label><input id="km" type="number" min="3" max="24" value="12"></div><div><label for="ka">الفائدة السنوية %</label><input id="ka" type="number" step="0.1" value="0"></div><div><label for="kt">طريقة الحساب</label><select id="kt"><option value="flat">ثابتة على الأصل</option><option value="reducing">متناقصة</option></select></div></div><p class="hint" id="kv"></p><button class="btn am" id="ks">حفظ كمسودة</button></div>':'';
 v.innerHTML=form+'<div class="card"><h2>العقود</h2><div class="wrap"><table><tr><th>العميل</th><th>المنتج</th><th>الإجمالي</th><th>القسط</th><th>المدة</th><th>الحالة</th><th></th></tr>'+r[0].data.map(function(c){
  var a='';
  if(c.status=='draft'&&['system_admin','branch_manager'].indexOf(role)>=0)a='<button class="btn sm" data-id="'+c.id+'" data-st="pending_credit">إرسال للائتمان</button>';
  if(c.status=='pending_credit'&&role=='credit_manager')a='<button class="btn sm am" data-id="'+c.id+'" data-st="approved">اعتماد</button> <button class="btn sm rd" data-id="'+c.id+'" data-st="rejected">رفض</button>';
  if(c.status=='approved'&&role=='system_admin')a='<button class="btn sm am" data-id="'+c.id+'" data-st="active">اعتماد العقد النهائي</button>';
  return '<tr><td>'+esc(c.customers&&c.customers.full_name)+'</td><td>'+esc(c.products&&c.products.name)+'</td><td>'+n(c.total)+'</td><td>'+n(c.installment)+'</td><td>'+c.months+'</td><td><span class="tag">'+ST[c.status]+'</span></td><td>'+a+'</td></tr>'}).join('')+'</table></div><p class="hint">القرار الائتماني لمدير الائتمان، والعقد النهائي لمدير النظام.</p></div>';
 v.onclick=async function(e){var id=e.target.getAttribute('data-id'),st=e.target.getAttribute('data-st');if(!id)return;
  var u={status:st};if(st=='approved'||st=='rejected')u.credit_note=prompt('ملاحظة القرار (اختياري)')||null;
  var x=await sb.from('contracts').update(u).eq('id',id);if(x.error)return msg(em(x.error),1);msg('تم التحديث');vCon()};
 if(!canNew)return;
 function pv(){var p=+$('#kr').value||0,d=+$('#kd').value||0,m=+$('#km').value||0,rt=+$('#ka').value||0,o=calcC(p,d,m,rt,$('#kt').value);$('#kv').textContent=o?'القسط التقريبي: '+n(o.inst)+' ج.م · الإجمالي: '+n(o.tot)+' (الحساب الرسمي وفحص القواعد يتمان عند الحفظ)':''}
 ['kr','kd','km','ka','kt'].forEach(function(i){$('#'+i).oninput=pv});
 $('#kp').onchange=function(){var p=S.products.filter(function(x){return x.id==$('#kp').value})[0];if(p){$('#ka').value=p.annual_rate;pv()}};
 $('#ks').onclick=async function(){
  var c=cu.filter(function(x){return x.id==$('#kc').value})[0];if(!c)return msg('اختر العميل',1);
  var x=await sb.from('contracts').insert({branch_id:c.branch_id,customer_id:c.id,product_id:$('#kp').value||null,price:+$('#kr').value,down_payment:+$('#kd').value||0,months:+$('#km').value,annual_rate:+$('#ka').value||0,method:$('#kt').value,status:'draft'});
  if(x.error)return msg(em(x.error),1);msg('تم حفظ المسودة');vCon()}
}

/* ---------- collection ---------- */
async function vColl(){
 var r=await Promise.all([sb.from('v_delinquency').select('*'),sb.from('contracts').select('id,installment,customers(full_name,phone,zones(name))').eq('status','active')]);
 if(r[0].error)throw r[0].error;

function parseRule(t){var pct=(t.match(/(\d+(?:\.\d+)?)\s*%/)||[])[1];
 if(pct&&/الدخل/.test(t))return{type:'installment_income',max_pct:+pct,label:'القسط ÷ الدخل الشهري لا يزيد عن '+pct+'%'};
 if(pct&&/مقدم/.test(t))return{type:'down_payment',min_pct:+pct,label:'المقدم لا يقل عن '+pct+'% من السعر (للأسعار فوق 15,000)'};
 return{type:'free_text',label:'قاعدة نصية تُحفظ كمرجع للمساعد بدون اختبار آلي'}}
async function testRule(s){
 if(s.type=='free_text')return null;
 var c=chk(await sb.from('contracts').select('installment,price,down_payment,customers(monthly_income)').limit(1000)),hit=0;
 c.forEach(function(x){if(s.type=='installment_income'){var inc=+(x.customers&&x.customers.monthly_income)||0;if(inc>0&&x.installment/inc*100>s.max_pct)hit++}else if(x.price>15000&&x.down_payment/x.price*100<s.min_pct)hit++});
 return{total:c.length,hit:hit}}
