<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#F6F6F6;--sf:#fff;--tx:#141414;--mu:#5E5E5E;--ln:#E3E3E3;--nv:#111;--am:#b5121b;--rd:#8f0e15;--gn:#2E7D4F}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6}
header{background:var(--nv);color:#fff;padding:10px 16px 0;position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top b{font-size:18px;font-weight:800}.top b i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--am);box-shadow:0 0 10px var(--am);margin-left:6px}
.top b{white-space:nowrap}.top>span{font-size:13px;display:flex;align-items:center;gap:6px;min-width:0}.top>span .btn{opacity:.9}@media (max-width:560px){.hbr{display:none}}#acc{background:rgba(255,255,255,.12);max-width:min(60vw,420px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:6px}
.tabs button{background:none;border:0;color:#fff;opacity:.7;font:inherit;padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--bg);color:var(--tx);opacity:1;font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px 14px 50px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mu)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:7px 9px;width:100%}
input[type=checkbox]{width:auto}
.btn{background:var(--nv);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer}
.btn.am{background:var(--am);color:#fff;font-weight:600}.btn.rd{background:var(--rd)}.btn.sm{padding:4px 10px;font-size:13px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.k div{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px}
.k b{display:block;font-size:20px}.k span{font-size:12px;color:var(--mu)}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:20px;border:1px solid var(--ln);color:var(--mu)}
.t1{color:var(--am);border-color:var(--am)}.t2{color:var(--rd);border-color:var(--rd)}.t0{color:var(--gn);border-color:var(--gn)}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.hint{color:var(--mu);font-size:13px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:600}
.msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--nv);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9;max-width:90vw}
.msg.show{display:block}.msg.bad{background:var(--rd)}
.login{max-width:380px;margin:8vh auto;border-top:4px solid var(--am)}.lg{text-align:center;margin-bottom:8px}.lg img{max-width:190px;max-height:110px;object-fit:contain;display:block;margin:0 auto 6px}.lgt{font-weight:800;font-size:20px;letter-spacing:1px}.top img{height:28px;vertical-align:middle;margin-left:8px;background:#fff;border-radius:4px;padding:2px}
.pay{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pay>*{flex:1;min-width:110px;width:auto}
.alert{border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px;border:1px solid var(--ln)}.alert.ok{border-color:var(--gn);color:var(--gn)}.alert.bad{border-color:var(--rd);color:var(--rd)}
.stp{display:flex;gap:4px;margin:6px 0}.stp span{flex:1;text-align:center;font-size:12px;padding:3px 2px;border-radius:6px;background:var(--bg);color:var(--mu);border:1px solid var(--ln)}.stp .dn{background:var(--gn);color:#fff;border-color:var(--gn)}.stp .cur{background:var(--am);color:#fff;border-color:var(--am);font-weight:600}
details.card>summary{cursor:pointer;list-style:none}details.card>summary::-webkit-details-marker{display:none}

.kv{width:100%;border-collapse:collapse;margin-bottom:6px}.kv th{width:30%;text-align:right;color:var(--mu);font-weight:600;white-space:normal;vertical-align:top}.kv td{white-space:normal}
.cfile h3{margin:14px 0 6px;font-size:15px;border-bottom:2px solid var(--am);padding-bottom:2px}.ph{display:flex;gap:12px;align-items:center}.ph>div{line-height:1.9}.ph b{font-size:16px}.ph img{height:54px}.pg{display:flex;gap:8px;flex-wrap:wrap}.pb{flex:1;min-width:220px;border:1px solid var(--ln);border-radius:8px;padding:8px}
.sig{display:flex;justify-content:space-around;margin-top:26px;text-align:center}
#pv{display:none}
.rpage{page-break-after:always}.rc{display:flex;border:1.5px solid #000;margin-bottom:6mm;height:84mm;overflow:hidden;font-size:14px;line-height:1.5;color:#000;background:#fff;font-weight:600}.rc .rmain{flex:1;min-width:0;padding:3mm 5mm 2mm;border-left:2px dashed #000;display:flex;flex-direction:column;justify-content:space-between}.rc .rstub{flex:none;width:26%;box-sizing:border-box;padding:3mm 3mm 2mm;display:flex;flex-direction:column;justify-content:space-between;font-size:12.5px}.rc .rt{text-align:center}.rc .rt b{display:inline-block;border:2px solid #000;border-radius:14px;padding:1px 26px;font-size:21px;box-shadow:2px 2px 0 #000}.rc .ln{display:flex;align-items:flex-end;gap:5px;white-space:nowrap}.rc .ln>i{font-style:normal}.rc .dt{flex:1;min-width:12mm;border-bottom:1.5px dotted #000;text-align:center;font-weight:700;white-space:normal;overflow:hidden;max-height:3em;line-height:1.35;padding:0 3px}.rc .amt{align-items:stretch}.rc .amt>i{align-self:center}.rc .sh{flex:1;white-space:normal;background:#bdbdbd;display:flex;align-items:center;justify-content:center;font-weight:700;padding:1px 6px;text-align:center;line-height:1.3;font-size:13px}.rc .lp{display:flex;border:1px solid #000;font-size:13px;text-align:center}.rc .lp div{display:flex;flex-direction:column;min-width:13mm}.rc .lp div+div{border-right:1px solid #000}.rc .lp span{border-bottom:1px solid #000;font-size:11px;padding:0 3px}.rc .lp b{padding:1px 3px}.rc .fx{font-weight:700}.rc .bx{border:1.5px solid #000;width:72%;margin:0 auto;text-align:center;font-size:12px}.rc .bx div{padding:1px 2px;min-height:6mm}.rc .bx div+div{border-top:1.5px solid #000}.rc .rstub .ln{white-space:normal;flex-direction:column;align-items:stretch;gap:0}.rc .rstub .dt{text-align:right;min-height:1.4em}
@media print{@page{size:A4;margin:12mm}body.printing>*:not(#pv){display:none!important}body.printing #pv{display:block!important;background:#fff;color:#000}body.printing{background:#fff}#pv .kv th,#pv .kv td{border:1px solid #999;padding:3px 6px;color:#000;font-size:12px}#pv .pb{border-color:#999}#pv a{color:#000;text-decoration:none}#pv .cfile h3{border-color:#000}}
.nbell{position:relative}.nbell b{position:absolute;top:-6px;left:-6px;background:var(--am);color:#fff;border-radius:10px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px}.ntit{padding:10px 12px;border-bottom:1px solid var(--ln);cursor:pointer;border-radius:8px}.ntit.un{background:rgba(181,18,27,.07);border-right:3px solid var(--am)}.ntit:hover{background:rgba(127,127,127,.08)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:10px}.two>div>.pb:only-child{height:100%}.pb .kv th{width:34%}.md{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;overflow:auto;padding:12px}.md>.card{max-width:960px;margin:0 auto}
:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.btn svg,.btn path,.btn circle,.btn rect{pointer-events:none}
.btn.wa{background:#1fa855;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;flex:0 0 auto;min-width:0}.btn.wa.sent{background:#7fbf96}.btn.wa.off{background:var(--ln);color:var(--mu);cursor:default}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:8px 0}
.kv.inst th,.kv.inst td{white-space:nowrap;width:auto}
.dfrow td{background:rgba(232,150,20,.12)}.dfrow td:first-child{box-shadow:inset -4px 0 0 #e89614}.dfb{color:#c77700;display:inline-flex;vertical-align:middle}.dfb svg{width:15px;height:15px}.tag.dft{color:#b36b00;border-color:#e89614;background:rgba(232,150,20,.12);display:inline-flex;align-items:center;gap:3px}.tag.dft svg{width:13px;height:13px}
@media print{.dfrow td{background:#f3f3f3!important}}
.pgx{border:1px solid var(--ln);border-radius:10px;padding:8px 10px;margin-top:8px}.pgx>b,.pgx .pgh b{display:flex;align-items:center;gap:6px}.pgh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);border-radius:999px;padding:5px 10px;font-size:13px;background:var(--bg);color:var(--mu);cursor:pointer;font:inherit;font-size:13px}
.pchip.on{background:var(--am);border-color:var(--am);color:#fff}.pchip[disabled]{cursor:default;opacity:.85}.pchip i{width:30px;height:16px;border-radius:9px;background:var(--ln);position:relative;flex:none}.pchip i:after{content:'';position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.15s}.pchip.on i{background:rgba(255,255,255,.45)}.pchip.on i:after{right:16px}
.ulist td{vertical-align:middle}.ulist .em{direction:ltr;text-align:right;font-size:12px;color:var(--mu)}

/* ===== ستايل الأنوار الكلاسيك المطوّر ===== */
:root{--bg:#F4F4F5;--ln:#E4E4E7;--mu:#52525B;--th:#FAFAFA;--side:#111111;--sh:0 1px 2px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e0e;--sf:#1a1a1a;--tx:#f0f0f0;--mu:#a5a5a5;--ln:#333;--nv:#000;--am:#d92432;--rd:#ef4b57;--gn:#4cb57a;color-scheme:dark;--th:#202022;--side:#000;--sh:none}}
:root[data-theme=dark]{--bg:#0e0e0e;--sf:#1a1a1a;--tx:#f0f0f0;--mu:#a5a5a5;--ln:#333;--nv:#000;--am:#d92432;--rd:#ef4b57;--gn:#4cb57a;color-scheme:dark;--th:#202022;--side:#000;--sh:none}
:root[data-theme=light]{color-scheme:light}
.thb{font-size:18px;line-height:1;min-width:40px}#thfl{position:fixed;top:12px;left:12px;z-index:50;border-radius:50%;width:42px;height:42px;padding:0;background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
.lay{display:flex;min-height:100vh;align-items:stretch}
.side{width:236px;flex:none;background:var(--side);color:#E7E7E7;position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px 24px;display:flex;flex-direction:column;z-index:6}
.side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side .logo{width:38px;height:38px;border-radius:10px;background:var(--am);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
.side .brand b{display:block;color:#fff;font-size:16px;line-height:1.2}.side .brand small{color:#9A9A9A;font-size:11.5px}
.side .tabs{display:flex;flex-direction:column;gap:2px;margin:0;overflow:visible}
.side .tabs button{display:flex;align-items:center;gap:10px;width:100%;text-align:right;color:#E7E7E7;opacity:1;padding:9px 12px;min-height:42px;border-radius:10px;font-size:14.5px;font-weight:500}
.side .tabs button:hover{background:rgba(255,255,255,.07)}
.side .tabs button.on{background:var(--am);color:#fff;font-weight:700}
.side .tabs button svg{flex:none;opacity:.9}
.mainw{flex:1;min-width:0;display:flex;flex-direction:column}
.top2{position:sticky;top:0;z-index:5;background:var(--sf);color:var(--tx);border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 24px}
.top2 h1{margin:0;font-size:20px;line-height:1.3}.top2 .sub{font-size:12.5px;color:var(--mu)}
.top2 .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top2 .btn{background:var(--sf);color:var(--tx);border:1px solid var(--ln);min-height:40px;border-radius:10px}
.top2 #lo{background:var(--nv);color:#fff;border-color:var(--nv)}
.top2 #acc{max-width:min(50vw,320px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--bg)}
.mainw main{max-width:1200px;width:100%;margin:0 auto;padding:22px 24px 60px}
.card{border-radius:14px;padding:16px;box-shadow:var(--sh)}
.k div{border-radius:14px;padding:14px 16px;border-top:4px solid var(--am);box-shadow:var(--sh)}
.k b{font-size:22px;letter-spacing:-.2px}.k span{font-size:12.5px}
th{background:var(--th);padding:9px 10px;font-size:13px}td{padding:9px 10px}
.btn{border-radius:10px;min-height:36px}.btn.sm{min-height:30px}
input,select,textarea{border-radius:10px;background:var(--sf)}
.tag{border:0;padding:2px 10px;font-weight:700;background:rgba(127,127,127,.12)}
.t1{background:rgba(181,18,27,.1);color:var(--am)}.t2{background:rgba(143,14,21,.14);color:var(--rd)}.t0{background:rgba(46,125,79,.12);color:var(--gn)}
.alert{border-radius:10px}
.login{border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
@media (max-width:900px){
 .lay{display:block}
 .side{position:sticky;top:0;width:auto;height:auto;padding:8px 10px 6px;overflow:visible}
 .side .brand{padding:2px 4px 6px}.side .logo{width:30px;height:30px;font-size:16px;border-radius:8px}
 .side .tabs{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}.side .tabs::-webkit-scrollbar{display:none}
 .side .tabs button{width:auto;white-space:nowrap;padding:7px 12px;min-height:38px;font-size:14px}
 .side .tabs button svg{display:none}
 .top2{position:static;padding:10px 14px}.top2 h1{font-size:18px}
 .mainw main{padding:14px 12px 50px}
}

/* حذف البيانات (مدير النظام) */
.dxbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0;padding:4px 0;border-bottom:1px dashed #f1c4c6}
.dxbt .btn{margin-top:4px}
td.dxc{width:28px;text-align:center}
#dxbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:60;background:#111;color:#fff;padding:10px 14px;border-radius:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.35);max-width:94vw}
#dxbar .btn:not(.rd){background:#fff;color:#111}
#dxdlg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px}
#dxdlg .dxin{max-width:460px;width:100%;margin:0}

/* اللوجو */
.lg img{max-width:240px!important;max-height:150px!important}
.lg img+.lgt{display:none}
.side .logo{background:#fff!important;padding:4px;overflow:hidden}
.side .logo img{width:100%;height:100%;object-fit:contain;display:block}
</style>
