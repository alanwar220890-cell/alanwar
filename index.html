.pchip.on{background:var(--am);border-color:var(--am);color:#fff}.pchip[disabled]{cursor:default;opacity:.85}.pchip i{width:30px;height:16px;border-radius:9px;background:var(--ln);position:relative;flex:none}.pchip i:after{content:'';position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.15s}.pchip.on i{background:rgba(255,255,255,.45)}.pchip.on i:after{right:16px}
.ulist td{vertical-align:middle}.ulist .em{direction:ltr;text-align:right;font-size:12px;color:var(--mu)}

 {t:'العملاء',ic:'user',p:[['cust.view','عرض العملاء','eye'],['cust.edit','إضافة وتعديل العملاء','edit'],['cust.import','استيراد العملاء من شيت','upload'],['cust.market','رسائل التسويق والعروض على واتساب','mega']]},
 {t:'العقود',ic:'note',p:[['con.view','عرض العقود','eye'],['con.create','إنشاء وتفعيل عقد جديد','plus'],['con.edit','تعديل العقد: بيانات العميل والكود والمقدم والضامن وإلغاء الترحيل','edit'],['con.manual','عقد قديم بقسط يدوي أو منتهي، وتعديل بيانات العقد','edit'],['con.send_credit','إرسال العقد للائتمان','send'],['con.credit','اعتماد أو رفض العقد ائتمانيًا','check'],['con.final','الاعتماد النهائي للعقد','shield'],['con.notes','تعديل ملاحظات البيعة','note'],['con.receipts','إيصالات الأمانة وعناوين البطاقة','print'],['con.import','استيراد وتصدير العقود','upload']]},
 {t:'التحصيل',ic:'cash',p:[['coll.view','عرض التحصيل والمتأخرين','eye'],['coll.pay','تسجيل تحصيل','cash'],['coll.defer','ترحيل قسط لتاريخ لاحق','clock'],['coll.cancel','إلغاء تحصيل','undo'],['coll.refer','تحويل العميل للشؤون القانونية','scale']]},

function canAny(a){return a.some(can)}
function effPerms(p){if(!p)return [];if(p.role=='system_admin')return PALL.slice();return p.perms||(S.pdef&&S.pdef[p.role])||[]}

/* ---------- boot / login ---------- */
async function boot(){
 if(!window.CFG||!CFG.url||!CFG.key){APP.innerHTML='<div class="card login"><h2>الإعداد ناقص</h2><p class="hint">افتح ملف config.js وضع رابط مشروع Supabase والمفتاح العام (anon).</p></div>';return}
 sb=sb||supabase.createClient(CFG.url,CFG.key);
 var s=await sb.auth.getSession();
 if(!s.data.session)return loginView();
 var p=await sb.from('profiles').select('*').eq('id',s.data.session.user.id).single();
 if(p.error||!p.data)return loginView('تعذر قراءة حسابك');
 S.me=p.data;
 if(!S.me.active){APP.innerHTML='<div class="card login"><h2>حسابك غير مفعّل</h2><p class="hint">اطلب من مدير النظام تفعيل حسابك وتحديد فرعك ودورك.</p><button class="btn" id="lo">خروج</button></div>';$('#lo').onclick=out;return}
 var r=await Promise.all([sb.from('zones').select('*').order('name'),sb.from('branches').select('*').order('name'),sb.from('products').select('*').order('name')]);
 S.zones=r[0].data||[];S.branches=r[1].data||[];S.products=r[2].data||[];
 await loadMe(p.data);
 shell();go(S.nav[0]);live();twCheck()
}

function cuDig(s){return String(s==null?'':s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})}
function cuNorm(s){return String(s==null?'':s).replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim()}
function cuWords(s){return String(s||'').trim().split(/\s+/).filter(Boolean).length}
function cuQ(v){v=v==null?'':String(v);return /[",\n\t]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function cuParse(text){
 text=String(text||'').replace(/^﻿/,'');
 var lines=text.split(/\r?\n/),first=lines.filter(function(l){return l.trim()&&l.trim().charAt(0)!='#'})[0]||'';
 var d=first.indexOf('\t')>=0?'\t':first.indexOf(';')>=0&&first.indexOf(',')<0?';':',';
 var rows=[],row=[],cur='',q=false,i,c;
 for(i=0;i<text.length;i++){c=text.charAt(i);
  if(q){if(c=='"'){if(text.charAt(i+1)=='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c=='"')q=true;
  else if(c==d){row.push(cur);cur=''}
  else if(c=='\n'||c=='\r'){if(c=='\r'&&text.charAt(i+1)=='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
  else cur+=c}
 if(cur!==''||row.length){row.push(cur);rows.push(row)}
 return rows.filter(function(r){var a=String(r[0]||'').trim();return r.some(function(x){return String(x).trim()})&&a.charAt(0)!='#'&&a.indexOf('مثال')!==0})
}

var IFD={whatsapp:[['phone_number_id','Phone Number ID'],['business_account_id','Business Account ID'],['sender_name','اسم المرسل']],sms:[['provider_name','اسم المزود'],['sender_id','Sender ID']],openai:[['model','النموذج (Model)'],['legal_approval_for_customer_data','تمت الموافقة القانونية على إرسال بيانات العملاء','bool']],vodafone_cash:[['merchant_number','رقم الاستلام'],['notes','ملاحظات']],maps:[['provider','المزود'],['default_lat','خط العرض الافتراضي'],['default_lng','خط الطول الافتراضي']],ai_assistant:[['autonomy_level','مستوى الاستقلالية','aut']]};
async function vInt(){
 var v=$('#v'),I=chk(await sb.from('integrations').select('*').order('label'));
 v.innerHTML='<div class="card"><h2>الربط والتكاملات</h2><p class="hint">هنا بيانات الربط غير السرية فقط. مفاتيح API السرية (OpenAI، واتساب، SMS) لا تُكتب في الموقع أبدًا، وتُضاف لاحقًا كأسرار (Secrets) في Supabase Edge Functions عند تفعيل الربط الفعلي.</p></div>'+I.map(function(i){
  var fs=IFD[i.provider]||[];
  return '<div class="card"><div class="row"><h2>'+esc(i.label)+'</h2><span>'+tg(i.enabled?'مفعّل':'غير مفعّل',i.enabled?'t0':'')+'</span></div><div class="f">'+fs.map(function(f){var id='if_'+i.provider+'_'+f[0],val=i.config[f[0]];
   if(f[2]=='bool')return '<div><label><input type="checkbox" id="'+id+'"'+(val?' checked':'')+'> '+f[1]+'</label></div>';
   if(f[2]=='aut')return '<div><label for="'+id+'">'+f[1]+'</label><select id="'+id+'">'+AUT.map(function(a,k){return '<option value="'+k+'"'+(k==(+val||0)?' selected':'')+'>'+k+' – '+a+'</option>'}).join('')+'</select></div>';
   return '<div><label for="'+id+'">'+f[1]+'</label><input id="'+id+'" value="'+esc(val)+'"></div>'}).join('')+'<div><label><input type="checkbox" id="en_'+i.provider+'"'+(i.enabled?' checked':'')+'> تفعيل</label></div></div><button class="btn sm am" data-isv="'+i.provider+'" style="margin-top:10px">حفظ</button></div>'}).join('');
 v.onclick=async function(e){var p=e.target.getAttribute('data-isv');if(!p)return;
  var it=I.filter(function(x){return x.provider==p})[0],cfg=Object.assign({},it.config);
  (IFD[p]||[]).forEach(function(f){var el=$('#if_'+p+'_'+f[0]);cfg[f[0]]=f[2]=='bool'?el.checked:f[2]=='aut'?+el.value:el.value.trim()});
  var en=$('#en_'+p).checked;
  if(p=='openai'&&en&&!cfg.legal_approval_for_customer_data)return msg('لا يمكن تفعيل OpenAI قبل تأكيد الموافقة القانونية على إرسال بيانات العملاء',1);
  upd('integrations',it.id,{config:cfg,enabled:en,updated_at:new Date().toISOString()},vInt)}
}

boot();
</script>
